name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEW_MOON_MOD: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Set up MoonBit 0.10.4
        uses: hustcer/setup-moonbit@v1.22
        with:
          version: 0.10.4+ade96c819
          core-version: 0.10.4+ade96c819
      - name: Set up Nushell 0.112.2
        uses: hustcer/setup-nu@v3
        with:
          version: "0.112.2"
      - name: Resolve dependencies
        run: |
          moon update
          moon check --target all --fmt --deny-warn
      - name: Verify
        run: nu ./scripts/verify.nu
      - name: Validate publish package
        run: nu ./scripts/verify-publish-package.nu
