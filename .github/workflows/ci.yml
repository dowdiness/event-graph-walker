name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEW_MOON_MOD: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Set up MoonBit 0.10.4
        uses: hustcer/setup-moonbit@v1.22
        with:
          version: 0.10.4+ade96c819
          core-version: 0.10.4+ade96c819
      - name: Set up Nushell 0.112.2
        uses: hustcer/setup-nu@v3
        with:
          version: "0.112.2"
      - name: Set up just 1.48.1
        uses: extractions/setup-just@v3
        with:
          just-version: "1.48.1"
      - name: Verify
        run: just ci
